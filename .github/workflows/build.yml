name: Build QuickBill APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK platform & build-tools are installed
        shell: bash
        run: |
          set -o pipefail
          {
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -f "$SDKMANAGER" ]; then
              SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
            fi
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          } 2>&1 | tee /tmp/sdk-setup.log

      - name: Generate a signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/quickbill-release.keystore" \
            -alias quickbill \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass quickbill123 -keypass quickbill123 \
            -dname "CN=QuickBill, OU=RPS, O=Rock Paper Scissors, L=Goa, ST=Goa, C=IN"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build-debug.log
        env:
          QUICKBILL_KEYSTORE: ${{ github.workspace }}/quickbill-release.keystore

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/build-release.log
        env:
          QUICKBILL_KEYSTORE: ${{ github.workspace }}/quickbill-release.keystore

      - name: Locate APKs
        run: find app/build/outputs/apk -name "*.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickBill-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickBill-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APKs to build-output branch
        run: |
          set -e
          mkdir -p /tmp/apk-out
          cp app/build/outputs/apk/debug/*.apk /tmp/apk-out/QuickBill-debug.apk
          cp app/build/outputs/apk/release/*.apk /tmp/apk-out/QuickBill-release.apk
          echo "Built from commit ${GITHUB_SHA} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/apk-out/BUILD_INFO.txt
          cd "$GITHUB_WORKSPACE"
          git config user.name "QuickBill CI"
          git config user.email "ci@quickbill.local"
          git checkout --orphan build-output
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/apk-out/*.apk .
          cp /tmp/apk-out/BUILD_INFO.txt .
          git add QuickBill-debug.apk QuickBill-release.apk BUILD_INFO.txt
          git commit -m "Built APKs for ${GITHUB_SHA}"
          git push --force origin HEAD:build-output

      - name: Publish failure diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/fail-out
          {
            echo "=== QuickBill CI failure for commit ${GITHUB_SHA} ==="
            echo
            echo "--- sdk-setup.log (tail) ---"
            tail -c 20000 /tmp/sdk-setup.log 2>/dev/null || echo "(no sdk-setup log captured)"
            echo
            echo "--- build-debug.log (tail) ---"
            tail -c 60000 /tmp/build-debug.log 2>/dev/null || echo "(no debug log captured)"
            echo
            echo "--- build-release.log (tail) ---"
            tail -c 60000 /tmp/build-release.log 2>/dev/null || echo "(no release log captured)"
          } > /tmp/fail-out/FAILURE_INFO.txt
          cd "$GITHUB_WORKSPACE"
          git config user.name "QuickBill CI"
          git config user.email "ci@quickbill.local"
          git checkout --orphan build-failed
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/fail-out/FAILURE_INFO.txt .
          git add FAILURE_INFO.txt
          git commit -m "Failure diagnostics for ${GITHUB_SHA}"
          git push --force origin HEAD:build-failed
