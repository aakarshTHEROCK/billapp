name: Build QuickBill APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK platform & build-tools are installed
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate a signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/quickbill-release.keystore" \
            -alias quickbill \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass quickbill123 -keypass quickbill123 \
            -dname "CN=QuickBill, OU=RPS, O=Rock Paper Scissors, L=Goa, ST=Goa, C=IN"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
        env:
          QUICKBILL_KEYSTORE: ${{ github.workspace }}/quickbill-release.keystore

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
        env:
          QUICKBILL_KEYSTORE: ${{ github.workspace }}/quickbill-release.keystore

      - name: Locate APKs
        run: find app/build/outputs/apk -name "*.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickBill-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickBill-release
          path: app/build/outputs/apk/release/*.apk
